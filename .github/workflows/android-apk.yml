name: Build CZert Remote APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager is missing on the GitHub Actions runner"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: CZert-Remote-v3.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish test APK to GitHub Releases
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0-preview
          name: CZert Remote v3.0 — testovacia APK
          prerelease: true
          make_latest: false
          body: |
            Testovacia (debug) Android APK. Kompilácia prebehla v GitHub Actions.
            Živý prenos a funkcie na dvoch telefónoch zatiaľ nie sú overené.
            Zdieľanie obrazovky, mikrofónu a kamery vyžaduje výslovné povolenie
            na používateľskom zariadení a viditeľnú aktívnu reláciu.
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
